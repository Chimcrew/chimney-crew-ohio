# If the Netlify UI still has "bun run build", change it to "npm run build".
# UI build settings override this file when they are set.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-fund --no-audit"

[dev]
  command = "npm run dev"
  port = 8080

[functions]
  directory = "netlify/functions"

# Client confirmation emails are sent 5 minutes after each booking.
# Bookings POST to /.netlify/functions/submit-lead, which immediately emails
# theductorsairduct@gmail.com and chimcrew@msg.workiz.com.
# Set RESEND_API_KEY in the Netlify UI. Optional: CONFIRM_FROM_EMAIL.

# Fingerprinted, immutable static assets. Files under public/ are served
# verbatim by Netlify, which otherwise sends `max-age=0, must-revalidate` and
# costs a conditional request per file per visit.
#
# Both of these are safe to freeze because their filenames change whenever
# their contents do:
#   - /fonts/*     name encodes family + weight + style + subset; regenerating
#                  a different face means a different filename
#                  (scripts/fetch-fonts.mjs)
#   - /optimized/l5e/*  name is a hash of the *source image bytes*
#                  (scripts/optimize-images.mjs)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/optimized/l5e/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
