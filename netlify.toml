# If the Netlify UI still has "bun run build", change it to "npm run build".
# UI build settings override this file when they are set.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-fund --no-audit"

[dev]
  command = "npm run dev"
  port = 8080

[functions]
  directory = "netlify/functions"

# Client confirmation emails are sent 5 minutes after each chimcrew-lead
# submit by netlify/functions/submission-created.ts (same as the old Lovable flow).
# Set RESEND_API_KEY in the Netlify UI. Keep your Form notification to yourself.
